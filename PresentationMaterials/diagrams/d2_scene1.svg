<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="640" fill="white"/>
  <text x="700" y="40" text-anchor="middle" font-size="26" font-weight="bold" fill="#111">Scene 1 — Factory Score: Ostinato Grid and Incommensurate Tape Loops</text>

  <!-- TUBS grid: 16 steps -->
  <text x="80" y="92" font-size="18" font-weight="bold" fill="#111">Machine ostinato — one bar of 16 sixteenth-steps at 76 BPM (step = 0.197 s)</text>
  <g>
    <!-- step cells -->
    <g stroke="#333" stroke-width="1.5">
      <!-- 16 cells, width 72 each, from x=120 -->
      <rect x="120" y="110" width="1152" height="64" fill="none" stroke-width="2"/>
      <line x1="192" y1="110" x2="192" y2="174"/><line x1="264" y1="110" x2="264" y2="174"/>
      <line x1="336" y1="110" x2="336" y2="174"/><line x1="408" y1="110" x2="408" y2="174"/>
      <line x1="480" y1="110" x2="480" y2="174"/><line x1="552" y1="110" x2="552" y2="174"/>
      <line x1="624" y1="110" x2="624" y2="174"/><line x1="696" y1="110" x2="696" y2="174"/>
      <line x1="768" y1="110" x2="768" y2="174"/><line x1="840" y1="110" x2="840" y2="174"/>
      <line x1="912" y1="110" x2="912" y2="174"/><line x1="984" y1="110" x2="984" y2="174"/>
      <line x1="1056" y1="110" x2="1056" y2="174"/><line x1="1128" y1="110" x2="1128" y2="174"/>
      <line x1="1200" y1="110" x2="1200" y2="174"/>
    </g>
    <!-- filled hits: steps 1,9 root (dark); 5,13 fifth (gray); 16 octave accent (outlined) -->
    <rect x="123" y="113" width="66" height="58" fill="#222"/>
    <rect x="699" y="113" width="66" height="58" fill="#222"/>
    <rect x="411" y="113" width="66" height="58" fill="#888"/>
    <rect x="987" y="113" width="66" height="58" fill="#888"/>
    <rect x="1203" y="113" width="66" height="58" fill="none" stroke="#222" stroke-width="4"/>
    <!-- labels in hits -->
    <g font-size="15" font-weight="bold" text-anchor="middle">
      <text x="156" y="147" fill="#fff">A2</text>
      <text x="732" y="147" fill="#fff">A2</text>
      <text x="444" y="147" fill="#fff">E2</text>
      <text x="1020" y="147" fill="#fff">E2</text>
      <text x="1236" y="147" fill="#222">+8ve</text>
    </g>
    <!-- step numbers -->
    <g font-size="13" fill="#555" text-anchor="middle">
      <text x="156" y="196">1</text><text x="228" y="196">2</text><text x="300" y="196">3</text><text x="372" y="196">4</text>
      <text x="444" y="196">5</text><text x="516" y="196">6</text><text x="588" y="196">7</text><text x="660" y="196">8</text>
      <text x="732" y="196">9</text><text x="804" y="196">10</text><text x="876" y="196">11</text><text x="948" y="196">12</text>
      <text x="1020" y="196">13</text><text x="1092" y="196">14</text><text x="1164" y="196">15</text><text x="1236" y="196">16</text>
    </g>
  </g>
  <text x="120" y="232" font-size="15" fill="#444">Percussive transients sliced at runtime from factory machine recordings; root and fifth alternate, octave accent closes the bar.</text>

  <!-- Tape loop timeline -->
  <text x="80" y="290" font-size="18" font-weight="bold" fill="#111">Four tape loops — periods never align (shown over 80 seconds)</text>
  <!-- time axis -->
  <g stroke="#999" stroke-width="1">
    <line x1="200" y1="560" x2="1320" y2="560"/>
    <line x1="200" y1="556" x2="200" y2="564"/><line x1="480" y1="556" x2="480" y2="564"/>
    <line x1="760" y1="556" x2="760" y2="564"/><line x1="1040" y1="556" x2="1040" y2="564"/>
    <line x1="1320" y1="556" x2="1320" y2="564"/>
  </g>
  <g font-size="13" fill="#555" text-anchor="middle">
    <text x="200" y="582">0 s</text><text x="480" y="582">20 s</text><text x="760" y="582">40 s</text><text x="1040" y="582">60 s</text><text x="1320" y="582">80 s</text>
  </g>
  <!-- rows: scale 14 px per second; x = 200 + t*14 -->
  <!-- Loop A: 21.3s, pitch root (A) -->
  <g>
    <text x="190" y="345" font-size="15" text-anchor="end" fill="#111">Loop 1 · A (root) · 21.3 s</text>
    <g fill="#2b2b2b">
      <rect x="200" y="330" width="294" height="22" rx="4"/>
      <rect x="498" y="330" width="294" height="22" rx="4"/>
      <rect x="796" y="330" width="294" height="22" rx="4"/>
      <rect x="1094" y="330" width="226" height="22" rx="4"/>
    </g>
  </g>
  <!-- Loop B: 26.7s, pitch -5 (E below) -->
  <g>
    <text x="190" y="400" font-size="15" text-anchor="end" fill="#111">Loop 2 · E (−5 st) · 26.7 s</text>
    <g fill="#555">
      <rect x="200" y="385" width="370" height="22" rx="4"/>
      <rect x="574" y="385" width="370" height="22" rx="4"/>
      <rect x="948" y="385" width="370" height="22" rx="4"/>
    </g>
  </g>
  <!-- Loop C: 33.1s, pitch +3 (C) -->
  <g>
    <text x="190" y="455" font-size="15" text-anchor="end" fill="#111">Loop 3 · C (+3 st) · 33.1 s</text>
    <g fill="#7d7d7d">
      <rect x="200" y="440" width="455" height="22" rx="4"/>
      <rect x="659" y="440" width="455" height="22" rx="4"/>
      <rect x="1118" y="440" width="202" height="22" rx="4"/>
    </g>
  </g>
  <!-- Loop D: 39.9s, pitch +5 (D) -->
  <g>
    <text x="190" y="510" font-size="15" text-anchor="end" fill="#111">Loop 4 · D (+5 st) · 39.9 s</text>
    <g fill="#a3a3a3">
      <rect x="200" y="495" width="550" height="22" rx="4"/>
      <rect x="754" y="495" width="550" height="22" rx="4"/>
      <rect x="1308" y="495" width="12" height="22" rx="4"/>
    </g>
  </g>
  <text x="700" y="620" text-anchor="middle" font-size="15" fill="#666">Each loop is anchored to a different machine object in the room. Like Music for Airports, the four periods are incommensurate: the texture never repeats exactly.</text>
</svg>
