<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="420" fill="white"/>
  <text x="700" y="40" text-anchor="middle" font-size="26" font-weight="bold" fill="#111">Shared Pitch Reservoir — A Minor Pentatonic, A3 to A5</text>
  <text x="700" y="70" text-anchor="middle" font-size="16" fill="#444">Semitones above A3 (220 Hz): 0 · 3 · 5 · 7 · 10 · 12 · 15 · 17 · 19 · 22 · 24 — used by the factory melody, metro ensemble, and sequencer orbs</text>

  <!-- staff: 5 lines, bottom line E4 at y=260, spacing 16px -->
  <g stroke="#222" stroke-width="2">
    <line x1="140" y1="196" x2="1300" y2="196"/>
    <line x1="140" y1="212" x2="1300" y2="212"/>
    <line x1="140" y1="228" x2="1300" y2="228"/>
    <line x1="140" y1="244" x2="1300" y2="244"/>
    <line x1="140" y1="260" x2="1300" y2="260"/>
    <line x1="140" y1="196" x2="140" y2="260"/>
    <line x1="1300" y1="196" x2="1300" y2="260"/>
  </g>
  <text x="120" y="240" font-size="20" fill="#222" text-anchor="end" font-style="italic">treble</text>

  <!-- notes: diatonic step positions above E4(y=260), halfstep=8px
       A3:-4 → y=292 ; C4:-2 → 276 ; D4:-1 → 268 ; E4:0 → 260 ; G4:2 → 244 ;
       A4:3 → 236 ; C5:5 → 220 ; D5:6 → 212 ; E5:7 → 204 ; G5:9 → 188 ; A5:10 → 180 -->
  <!-- x positions: 11 notes spaced 100px from 240 -->
  <g fill="#111">
    <!-- ledger lines -->
    <g stroke="#222" stroke-width="2">
      <line x1="220" y1="276" x2="260" y2="276"/><line x1="220" y1="292" x2="260" y2="292"/>
      <line x1="320" y1="276" x2="360" y2="276"/>
      <line x1="1220" y1="180" x2="1260" y2="180"/>
    </g>
    <ellipse cx="240" cy="292" rx="12" ry="8.5"/>
    <ellipse cx="340" cy="276" rx="12" ry="8.5"/>
    <ellipse cx="440" cy="268" rx="12" ry="8.5"/>
    <ellipse cx="540" cy="260" rx="12" ry="8.5"/>
    <ellipse cx="640" cy="244" rx="12" ry="8.5"/>
    <ellipse cx="740" cy="236" rx="12" ry="8.5"/>
    <ellipse cx="840" cy="220" rx="12" ry="8.5"/>
    <ellipse cx="940" cy="212" rx="12" ry="8.5"/>
    <ellipse cx="1040" cy="204" rx="12" ry="8.5"/>
    <ellipse cx="1140" cy="188" rx="12" ry="8.5"/>
    <ellipse cx="1240" cy="180" rx="12" ry="8.5"/>
  </g>
  <!-- note names -->
  <g font-size="17" fill="#111" text-anchor="middle" font-weight="bold">
    <text x="240" y="330">A3</text><text x="340" y="330">C4</text><text x="440" y="330">D4</text>
    <text x="540" y="330">E4</text><text x="640" y="330">G4</text><text x="740" y="330">A4</text>
    <text x="840" y="330">C5</text><text x="940" y="330">D5</text><text x="1040" y="330">E5</text>
    <text x="1140" y="330">G5</text><text x="1240" y="330">A5</text>
  </g>
  <g font-size="14" fill="#777" text-anchor="middle">
    <text x="240" y="352">0</text><text x="340" y="352">+3</text><text x="440" y="352">+5</text>
    <text x="540" y="352">+7</text><text x="640" y="352">+10</text><text x="740" y="352">+12</text>
    <text x="840" y="352">+15</text><text x="940" y="352">+17</text><text x="1040" y="352">+19</text>
    <text x="1140" y="352">+22</text><text x="1240" y="352">+24</text>
  </g>
  <text x="700" y="395" text-anchor="middle" font-size="15" fill="#666">Scene 1 tape loops transpose the same set below the root: A (0), E (−5), C (+3), D (+5). The error buzz is A2 (110 Hz); the lamp drone stacks A2 + E3 + A3.</text>
</svg>
